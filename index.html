<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!-- Content-Security-Policy: PitchPro laedt nichts nach. Alles steckt in
     dieser Datei, die App baut von sich aus keine Verbindung nach aussen auf. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<title>PitchPro</title>
<link rel="icon" type="image/png" href="image.png">
<link rel="apple-touch-icon" href="image.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  /* Farbfamilie wie TacticBoard: dunkle Oberflaeche, Rasengruen, Kader-Blau */
  --bg:#1a1a1a; --surface:#262626; --surface2:#303030; --line:#3b3b3b;
  --text:#f3f3f3; --muted:#a9a9a9;
  --green:#4caf50; --green-d:#2e7d32; --green-soft:#24402a;
  --opp:#2a6f97; --opp-soft:#1f3442;
  --yellow:#f4c20d; --red:#e53935; --amber:#ff9f1c; --amber-soft:#3d2c12;
  --top:#111111;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --r:14px;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-text-size-adjust:100%; }
body { display:flex; flex-direction:column; overflow:hidden; user-select:none; -webkit-user-select:none; }
input, textarea { user-select:text; -webkit-user-select:text; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
.num { font-variant-numeric:tabular-nums; }

/* ---------- Kopfzeile ---------- */
#top { background:var(--top); padding:calc(var(--safe-t) + 6px) 8px 8px; display:flex; align-items:center; gap:4px; min-height:56px; flex:0 0 auto; }
#top .title { flex:1; font-size:19px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:6px; }
#top button { min-width:44px; height:44px; padding:0 10px; border-radius:10px; font-size:16px; font-weight:700; }
#top button:active { background:#222; }
#back { font-size:26px !important; }
#back[hidden], #right[hidden], #right2[hidden] { display:none; }

#view { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px calc(var(--safe-b) + 90px); }
.wrap { max-width:720px; margin:0 auto; }

/* ---------- Bausteine ---------- */
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; }
.sec { display:flex; justify-content:space-between; align-items:center; margin:22px 2px 8px; }
.sec h2 { margin:0; font-size:13px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
.sec .meta { font-size:13px; font-weight:800; color:var(--green); }
.sec .link { color:var(--green); font-weight:700; font-size:14px; padding:6px 4px; }
.btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:50px; padding:0 16px;
  border-radius:var(--r); font-size:16px; font-weight:800; background:var(--green); color:#fff; }
.btn:active { filter:brightness(0.85); }
.btn.lg { min-height:60px; font-size:19px; }
.btn.soft { background:var(--green-soft); color:#a5e0a8; }
.btn.ghost { background:transparent; border:1.5px solid var(--line); color:var(--text); }
.btn.danger { background:var(--red); }
.btn.opp { background:var(--opp); }
.btn[disabled] { opacity:.35; pointer-events:none; }
.row2 { display:flex; gap:8px; }
.row2 > * { flex:1; }
.stack > * + * { margin-top:8px; }
.hint { color:var(--muted); font-size:13px; line-height:1.45; margin:6px 2px 0; }
.empty { color:var(--muted); font-size:15px; padding:10px 2px; line-height:1.45; }
input.in, textarea.in { width:100%; min-height:50px; padding:0 12px; border-radius:var(--r); border:1.5px solid var(--line);
  background:var(--bg); color:var(--text); font-size:17px; outline:none; }
textarea.in { padding:12px; min-height:150px; resize:vertical; font-size:16px; }
input.in:focus, textarea.in:focus { border-color:var(--green); }
input.nr { width:68px; flex:0 0 68px; text-align:center; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { padding:9px 14px; border-radius:999px; border:1.5px solid var(--line); font-size:15px; font-weight:600; background:var(--surface); }
.chip.on { background:var(--green); border-color:var(--green); color:#fff; }
.chip.on.opp { background:var(--opp); border-color:var(--opp); }
.list-row { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:14px 16px; margin-bottom:8px; width:100%; text-align:left; }
.list-row:active { background:var(--surface2); }
.list-row .main { flex:1; min-width:0; }
.list-row .t1 { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-row .t2 { font-size:13px; color:var(--muted); margin-top:2px; }
.list-row .big { font-size:24px; font-weight:900; color:var(--green); }
.dot { width:10px; height:10px; border-radius:50%; flex:0 0 10px; }
.pnum { width:32px; font-size:18px; font-weight:900; color:var(--green); }

/* Stepper */
.step { display:flex; align-items:center; justify-content:space-between; padding:6px 0; gap:8px; }
.step .lbl { font-size:16px; flex:1; }
.step .ctl { display:flex; align-items:center; gap:6px; }
.step .ctl button { width:44px; height:44px; border-radius:22px; background:var(--green-soft); color:#a5e0a8; font-size:24px; font-weight:700; }
.step .val { min-width:66px; text-align:center; font-size:17px; font-weight:800; }
.toggle { display:flex; align-items:center; gap:12px; padding-top:10px; width:100%; text-align:left; }
.sw { width:52px; height:32px; border-radius:16px; background:var(--line); padding:3px; flex:0 0 52px; transition:background .15s; }
.sw i { display:block; width:26px; height:26px; border-radius:13px; background:#fff; transition:transform .15s; }
.sw.on { background:var(--green); } .sw.on i { transform:translateX(20px); }

/* Aufstellung */
.lu { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:6px 6px 6px 12px; min-height:58px; margin-bottom:8px; }
.lu.absent { opacity:.45; }
.lu .nm { flex:1; font-size:16px; font-weight:600; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seg { display:flex; background:var(--bg); border-radius:10px; padding:3px; }
.seg button { padding:9px 10px; border-radius:8px; font-size:13px; font-weight:700; color:var(--muted); }
.seg button.on { background:var(--green); color:#fff; }
.tw { font-size:12px; font-weight:900; padding:7px 8px; border-radius:8px; border:1.5px solid var(--line); color:var(--muted); }
.tw.on { background:var(--amber); border-color:var(--amber); color:#1a1a1a; }

/* ---------- Live ---------- */
.board { background:var(--green-d); margin:-16px -16px 0; padding:12px 16px 16px;
  /* Anzeigetafel bleibt beim Scrollen oben stehen - Uhr und Knoepfe immer im Blick */
  position:sticky; top:-16px; z-index:5; box-shadow:0 6px 14px rgba(0,0,0,.35); transition:padding .15s; }
.board.compact { padding:6px 16px 10px; }
.board.compact .score { font-size:32px; }
.board.compact .score-row .tn { font-size:13px; }
.board.compact .clock { font-size:24px; margin-top:0; }
.board.compact .status { display:none; }
.board.compact .ctrls { margin-top:6px; }
.board.compact .ctrls .btn { min-height:42px; font-size:15px; }
.score-row { display:flex; align-items:center; gap:12px; max-width:720px; margin:0 auto; }
.score-row .tn { flex:1; font-size:15px; font-weight:700; line-height:1.25; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.score-row .tn.r { text-align:right; }
.score { font-size:50px; font-weight:900; letter-spacing:1px; }
.clock { display:block; margin:2px auto 0; font-size:36px; font-weight:800; text-align:center; padding:0 12px; border-radius:10px; }
.clock.over { color:var(--yellow); }
.status { text-align:center; font-size:13px; font-weight:600; color:rgba(255,255,255,.8); }
.ctrls { display:flex; gap:8px; margin:12px auto 0; max-width:720px; }
.ctrls .btn { background:rgba(255,255,255,.95); color:var(--green-d); }
.ctrls .btn.danger { background:var(--red); color:#fff; }

.due { background:var(--amber-soft); border:2px solid var(--amber); border-radius:var(--r); padding:14px; margin-top:16px; }
.due h3 { margin:0 0 8px; color:var(--amber); font-size:19px; }
.sug { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.sug span { flex:1; font-size:16px; font-weight:700; }
.sug .btn { width:auto; min-height:44px; }
.next { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; margin-top:16px; font-size:14px; color:var(--muted); }
.next b { color:var(--text); }
.next .s { color:var(--text); font-weight:600; margin-top:2px; }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.tile { background:var(--surface); border:2px solid var(--green); border-radius:var(--r); padding:10px 12px; min-height:92px; text-align:left; display:block; width:100%; }
.tile:active { transform:scale(.97); }
.tile.bench { border-color:var(--line); background:#202020; }
.tile .top { display:flex; align-items:center; gap:6px; }
.tile .n { font-size:24px; font-weight:900; color:var(--green); }
.tile.bench .n { color:var(--muted); }
.tile .m { margin-left:auto; font-size:14px; font-weight:700; color:var(--muted); }
.tile .nm { font-size:16px; font-weight:700; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.twb { font-size:11px; font-weight:900; background:var(--amber); color:#1a1a1a; padding:1px 5px; border-radius:5px; }
.badges { display:flex; align-items:center; gap:6px; height:18px; margin-top:4px; font-size:13px; font-weight:800; }
.cardi { width:10px; height:14px; border-radius:2px; display:inline-block; }
.bar { height:4px; background:var(--bg); border-radius:2px; margin-top:8px; overflow:hidden; }
.bar i { display:block; height:4px; background:var(--green); }
.sentoff { color:var(--red); font-weight:600; margin-top:8px; }
.oppbtn { display:block; width:100%; text-align:left; background:var(--opp); border-radius:var(--r); padding:16px; min-height:74px; }
.oppbtn:active { filter:brightness(.85); }
.oppbtn .t1 { font-size:20px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.oppbtn .t2 { font-size:13px; color:rgba(255,255,255,.8); margin-top:2px; }
.otile { background:var(--opp-soft); border-radius:var(--r); padding:10px 12px; text-align:left; width:100%; }
.otile .n { font-size:18px; font-weight:900; color:#7fb8dc; }
.otile .nm { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ev { display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--line); width:100%; text-align:left; }
.ev .mi { width:52px; font-size:15px; font-weight:800; }
.ev .mk { width:4px; align-self:stretch; border-radius:2px; }
.ev .tx { flex:1; font-size:15px; }

/* Statistik */
.teamsel { display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.teamsel::-webkit-scrollbar { display:none; }
.teamsel .chip { flex:0 0 auto; font-size:16px; padding:11px 16px; }
.about-head { display:flex; align-items:center; gap:16px; }
.about-head img { border-radius:16px; flex:0 0 72px; }
.about-head .ah1 { font-size:24px; font-weight:900; }
.about p { margin:0; font-size:15px; line-height:1.55; }
.about p + p { margin-top:10px; }
.about b { color:#a5e0a8; }
.notes { min-height:84px; font-size:16px; background:var(--surface); }
.notes-view { white-space:pre-wrap; font-size:15px; line-height:1.5; user-select:text; -webkit-user-select:text; }
.ast { color:#a5e0a8; }
.so-row { padding:10px 0; border-top:1px solid var(--line); }
.so-name { font-weight:700; margin-bottom:6px; }
.so-dots { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; min-height:22px; }
.so-dot { width:22px; height:22px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; }
.so-dot.in { background:var(--green); color:#fff; }
.so-dot.out { background:var(--red); color:#fff; }
.so-sm { display:block; font-size:12px; color:var(--muted); text-align:right; font-weight:700; }
.srec { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; font-size:15px; color:var(--muted); margin-bottom:6px; }
.srec b { font-size:30px; color:var(--text); }
.srec span { color:var(--text); font-weight:700; }
.srow { display:flex; justify-content:space-between; padding:8px 0 0; border-top:1px solid var(--line); margin-top:8px; font-size:14px; }
.srow span:first-child { color:var(--muted); font-weight:700; }
.sp { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; margin-bottom:8px; }
.sp .top { display:flex; align-items:center; gap:10px; }
.sp .main { flex:1; min-width:0; }
.sp .t1 { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp .t2 { font-size:13px; color:var(--muted); margin-top:2px; }
.sp .gl { font-size:18px; font-weight:900; text-align:right; white-space:nowrap; }
.sp .gl small { display:block; font-size:11px; color:var(--muted); font-weight:600; }
.sp .bar { height:6px; margin-top:10px; }
.sp .sl { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); margin-top:6px; }

/* Bericht */
.rhead { text-align:center; padding:26px 16px; }
.rhead .tm { font-size:17px; font-weight:700; }
.rhead .sc { font-size:60px; font-weight:900; color:var(--green); }
.rhead .ht { color:var(--muted); font-weight:600; }
.rhead .dt { color:var(--muted); font-size:13px; margin-top:8px; }
.pt { margin-bottom:10px; }
.pt .r { display:flex; justify-content:space-between; font-size:15px; font-weight:600; }
.pt .bar { height:6px; margin-top:4px; }

/* ---------- Auswahlblatt ---------- */
#ov { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:20; }
#ov.open { display:block; }
#sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--bg); border-radius:22px 22px 0 0;
  padding:12px 16px calc(var(--safe-b) + 16px); max-height:88vh; overflow-y:auto; transform:translateY(105%); transition:transform .2s ease;
  max-width:720px; margin:0 auto; border-top:1px solid var(--line); }
#sheet.open { transform:translateY(0); }
#sheet .grab { width:44px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px; }
#sheet h3 { margin:0; font-size:21px; font-weight:800; }
#sheet .sub { color:var(--muted); font-size:14px; margin:3px 0 12px; }
.act { display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:8px 16px; border-radius:var(--r);
  background:var(--surface); border:1px solid var(--line); text-align:left; margin-bottom:8px; }
.act:active { background:var(--surface2); }
.act .sw2 { width:16px; height:24px; border-radius:3px; flex:0 0 16px; }
.act .l { font-size:17px; font-weight:700; }
.act .h { font-size:13px; color:var(--muted); }
.preview { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 14px; margin:8px 0; font-size:15px; line-height:1.6; }

#toast { position:fixed; left:50%; bottom:calc(var(--safe-b) + 24px); transform:translateX(-50%); background:#f3f3f3; color:#111;
  padding:12px 18px; border-radius:12px; font-weight:600; font-size:15px; z-index:30; opacity:0; pointer-events:none; transition:opacity .2s;
  max-width:90vw; text-align:center; }
#toast.show { opacity:1; }
</style>
</head>
<body>
<header id="top">
  <button id="back" data-act="back" aria-label="Zurück" hidden>‹</button>
  <div class="title" id="title">PitchPro</div>
  <button id="right2" hidden></button>
  <button id="right" hidden></button>
</header>
<main id="view"></main>
<div id="ov" data-act="closeSheet"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>
<input type="file" id="file-in" accept=".json,application/json,text/plain" style="display:none" />

<script>

   SPRACHE

function cleanMatch(m){

/* ---------------------------------------------------------------------
   SPIELUHR
   Laeuft ueber Zeitstempel - stimmt also auch, wenn die App im
   Hintergrund war oder neu gestartet wurde.
--------------------------------------------------------------------- */
const Clock = {
  fresh: () => ({ status: 'pre', period: 1, periodElapsedMs: 0, completedMs: 0, runningSince: null }),
  periodElapsed(c, now){
    const run = c.status === 'running' && c.runningSince != null ? now - c.runningSince : 0;
    return c.periodElapsedMs + Math.max(0, run);
  },
  game(c, now){
    if(c.status === 'break' || c.status === 'finished') return c.completedMs;
    return c.completedMs + Clock.periodElapsed(c, now);
  },
  stamp(c, now){
    const brk = c.status === 'break' || c.status === 'finished';
    const st = { period: c.period, periodMs: brk ? c.periodElapsedMs : Clock.periodElapsed(c, now), gameMs: Clock.game(c, now) };
    if(brk) st.brk = c.status === 'finished' ? 'ft' : 'ht';   // in der Pause bzw. nach Abpfiff notiert
    return st;
  },
  start(c, now){
    if(c.status === 'pre' || c.status === 'paused') return Object.assign({}, c, { status: 'running', runningSince: now });
    if(c.status === 'break') return Object.assign({}, c, { status: 'running', period: c.period + 1, periodElapsedMs: 0, runningSince: now });
    return c;
  },
  pause(c, now){
    if(c.status !== 'running') return c;
    return Object.assign({}, c, { status: 'paused', periodElapsedMs: Clock.periodElapsed(c, now), runningSince: null });
  },
  endPeriod(c, now, periods){
    if(c.status !== 'running' && c.status !== 'paused') return c;
    const el = Clock.periodElapsed(c, now);
    return Object.assign({}, c, { status: c.period >= periods ? 'finished' : 'break', periodElapsedMs: el,
      completedMs: c.completedMs + el, runningSince: null });
  },
  /* Versehentlich beendeten Abschnitt wieder aufnehmen (Uhr steht danach auf Pause) */
  reopen(c){
    if(c.status !== 'break' && c.status !== 'finished') return c;
    return Object.assign({}, c, { status: 'paused', completedMs: Math.max(0, c.completedMs - c.periodElapsedMs), runningSince: null });
  },
  adjust(c, now, delta){
    if(c.status !== 'running' && c.status !== 'paused') return c;
    const cur = Clock.periodElapsed(c, now);
    const target = Math.max(0, cur + delta);
    return Object.assign({}, c, { periodElapsedMs: c.periodElapsedMs + (target - cur) });
  }
};
function fmtClock(ms){
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
/* Regulaere Abschnitte + optionale Verlaengerung (m.extra = { periods, minutes }) */
const totalPeriods = m => m.settings.periods + (m.extra ? m.extra.periods : 0);
const isExtra = (m, p) => !!m.extra && p > m.settings.periods;
const periodLen = (m, p) => isExtra(m, p) ? m.extra.minutes : m.settings.periodMinutes;
function periodStartMin(m, p){
  const r = m.settings.periods, pm = m.settings.periodMinutes;
  return p <= r || !m.extra ? (p - 1) * pm : r * pm + (p - r - 1) * m.extra.minutes;
}
const fullLengthMs = m => (m.settings.periods * m.settings.periodMinutes + (m.extra ? m.extra.periods * m.extra.minutes : 0)) * 60000;
/* Fussball-Minute: 23', 45+2', in der Pause HZ. Zweites Argument: Spiel
   (oder - fuer einfache Faelle - nur die Abschnittslaenge in Minuten). */
function fmtMinute(st, m){
  if(typeof m === 'number') m = { settings: { periods: 99, periodMinutes: m } };
  if(st.brk === 'ft') return T().ftShort;
  if(st.brk) return m.settings.periods === 2 && st.period === 1 ? T().breakShort : T().pauseShort;
  const base = periodStartMin(m, st.period), len = periodLen(m, st.period);
  const min = Math.floor(st.periodMs / 60000) + 1;
  return min > len ? (base + len) + '+' + (min - len) + "'" : (base + min) + "'";
}
function displayClock(m, now){
  return fmtClock(periodStartMin(m, m.clock.period) * 60000 + Clock.periodElapsed(m.clock, now));
}
function periodLabelM(m, p){
  return isExtra(m, p) ? T().extraP(p - m.settings.periods) : periodLabel(p, m.settings.periods);
}
function breakLabelM(m, p){
  if(m.extra && p === m.settings.periods) return T().breakBeforeExtra;
  if(isExtra(m, p)) return T().breakAfter(periodLabelM(m, p));
  return breakLabel(p, m.settings.periods);
}
function periodLabel(p, n){
  const t = T();
  if(n === 2) return p === 1 ? t.p1 : t.p2;
  if(n === 4) return t.quarter(p);
  if(n === 3) return t.third(p);
  if(n === 1) return t.gameTime;
  return t.part(p);
}
const breakLabel = (p, n) => n === 2 ? T().breakHT : T().breakAfter(periodLabel(p, n));

/* ---------------------------------------------------------------------
   SPIELSTAND, SPIELZEITEN, WECHSELVORSCHLAEGE
   Alles wird aus Startaufstellung + Ereignissen abgeleitet. Deshalb
   bleibt der Zustand auch nach dem Loeschen eines Ereignisses stimmig.
--------------------------------------------------------------------- */
/* Reihenfolge nach Abschnitt und Minute im Abschnitt - so wie angezeigt. Nur
   bei Gleichstand entscheidet die Gesamtzeit. (Nach dem Bearbeiten einer
   Minute koennte die Gesamtzeit allein sonst eine andere Reihenfolge ergeben.) */
const sortEvents = evs => evs.slice().sort((a, b) => (a.period - b.period) || (a.periodMs - b.periodMs) || (a.gameMs - b.gameMs));

function derive(m, nowGame){
  const stats = {};
  m.ownPlayers.concat(m.oppPlayers).forEach(p => {
    stats[p.id] = { goals: 0, pens: 0, own: 0, assists: 0, yellow: 0, yellowRed: 0, red: 0, played: 0 };
  });
  const score = { own: 0, opp: 0 };
  const firstOver = m.clock.period > 1 || m.clock.status === 'break' || m.clock.status === 'finished';
  const onField = new Set(m.startingIds.filter(id => stats[id]));
  const sentOff = new Set();
  const since = {};
  let keeperId = m.keeperId || null;
  onField.forEach(id => { since[id] = 0; });
  const leave = (id, at) => {
    if(onField.has(id)){ stats[id].played += Math.max(0, at - since[id]); onField.delete(id); delete since[id]; }
  };
  sortEvents(m.events).forEach(e => {
    if(e.type === 'goal'){
      score[e.side]++;
      const s = e.playerId && stats[e.playerId];
      if(s){ if(e.kind === 'ownGoal') s.own++; else { s.goals++; if(e.kind === 'penalty') s.pens++; } }
      if(e.assistId && e.kind === 'normal' && stats[e.assistId]) stats[e.assistId].assists++;
    } else if(e.type === 'card'){
      const s = e.playerId && stats[e.playerId];
      if(s){
        s[e.card]++;
        if(e.card !== 'yellow'){ sentOff.add(e.playerId); leave(e.playerId, e.gameMs); }
      }
    } else if(e.type === 'sub' && e.side === 'own'){
      // Nur gueltige Wechsel zaehlen: wer raus soll, muss auf dem Platz stehen,
      // wer rein soll, auf der Bank. Nach dem Loeschen frueherer Ereignisse
      // koennen spaetere Wechsel ungueltig werden - die bleiben dann wirkungslos,
      // statt einen Spieler zu viel aufs Feld zu stellen.
      // outId leer = Spieler kommt zusaetzlich dazu (z. B. kam zu spaet).
      const canIn = stats[e.inId] && !sentOff.has(e.inId) && !onField.has(e.inId);
      if(!canIn) return;
      if(e.outId){
        if(!onField.has(e.outId)) return;
        leave(e.outId, e.gameMs);
        if(keeperId === e.outId) keeperId = e.inId;   // Torwart ausgewechselt -> Ersatz steht im Tor
      }
      onField.add(e.inId); since[e.inId] = e.gameMs;
    } else if(e.type === 'keeper' && e.side === 'own'){
      keeperId = e.playerId || null;
    }
  });
  onField.forEach(id => { stats[id].played += Math.max(0, nowGame - since[id]); });
  let halfTime = null;
  if(firstOver){
    halfTime = { own: 0, opp: 0 };
    m.events.forEach(e => { if(e.type === 'goal' && e.period === 1) halfTime[e.side]++; });
  }
  const ids = m.ownPlayers.slice().sort(byNumber).map(p => p.id);
  return {
    score, halfTime, stats, keeperId,
    onField: ids.filter(id => onField.has(id)),
    bench: ids.filter(id => !onField.has(id) && !sentOff.has(id)),
    sentOff: ids.filter(id => sentOff.has(id))
  };
}

/* Feldspieler mit der meisten Spielzeit raus, Bankspieler mit der
   wenigsten rein. Der Torwart wird nicht automatisch getauscht. */
function suggestSubs(m, st, minDiff){
  minDiff = minDiff == null ? 2 * 60000 : minDiff;
  const pl = id => st.stats[id] ? st.stats[id].played : 0;
  const field = st.onField.filter(id => id !== st.keeperId).sort((a, b) => pl(b) - pl(a));
  const bench = st.bench.filter(id => id !== st.keeperId).sort((a, b) => pl(a) - pl(b));
  const out = [];
  for(let i = 0; i < Math.min(field.length, bench.length); i++){
    const d = pl(field[i]) - pl(bench[i]);
    if(d < minDiff) break;
    out.push({ outId: field[i], inId: bench[i] });
  }
  return out;
}
function fairShare(m){
  const total = fullLengthMs(m);
  const k = m.keeperId ? 1 : 0;
  const slots = Math.max(0, m.settings.playersOnField - k);
  const n = Math.max(1, m.ownPlayers.length - k);
  return Math.min(total, slots * total / n);
}
function msUntilReminder(m, now){
  const iv = m.settings.subIntervalMinutes * 60000;
  if(!iv || m.clock.status === 'pre' || m.clock.status === 'finished') return null;
  return iv - (Clock.game(m.clock, now) - (m.reminderAckMs || 0));
}

/* ---------------------------------------------------------------------
   STATISTIK UEBER MEHRERE SPIELE
   Gezaehlt werden abgeschlossene Spiele des Teams. Spieler werden ueber
   ihre Kader-ID zusammengefuehrt, die in jedem Spiel gleich bleibt.
--------------------------------------------------------------------- */
function seasonStart(ts){
  const d = new Date(ts);
  return d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1;   // Saison beginnt am 1. Juli
}
function seasonLabel(y){ return y + '/' + String(y + 1).slice(2); }
function rangeBounds(range){
  const y = seasonStart(Date.now());
  if(range === 'season') return [new Date(y, 6, 1).getTime(), new Date(y + 1, 6, 1).getTime()];
  if(range === 'first') return [new Date(y, 6, 1).getTime(), new Date(y + 1, 0, 1).getTime()];
  if(range === 'second') return [new Date(y + 1, 0, 1).getTime(), new Date(y + 1, 6, 1).getTime()];
  return [0, Infinity];
}
function teamStats(teamId, range){
  const [from, to] = rangeBounds(range);
  const team = teamById(teamId);
  const ms = DB.matches.filter(m => m.ownTeamId === teamId && m.clock.status === 'finished' && matchDate(m) >= from && matchDate(m) < to);
  const live = DB.matches.filter(m => m.ownTeamId === teamId && m.clock.status !== 'finished').length;
  const rec = () => ({ n: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 });
  const all = rec(), home = rec(), away = rec();
  const P = {};
  ms.slice().sort((a, b) => matchDate(b) - matchDate(a)).forEach(m => {
    const total = m.clock.completedMs;
    const st = derive(m, total);
    [all, m.isHome ? home : away].forEach(r => {
      r.n++; r.gf += st.score.own; r.ga += st.score.opp;
      const res = matchResult(m, st.score);   // nach Elfmeterschiessen zaehlt der Sieger
      if(res > 0) r.w++; else if(res === 0) r.d++; else r.l++;
    });
    const subbedIn = new Set(m.events.filter(e => e.type === 'sub' && e.side === 'own').map(e => e.inId));
    m.ownPlayers.forEach(p => {
      const kp = team && team.players.find(x => x.id === p.id);
      const a = P[p.id] || (P[p.id] = { id: p.id, name: kp ? kp.name : p.name, number: kp ? kp.number : p.number,
        keeper: !!(kp && kp.keeper), squad: 0, apps: 0, starts: 0, min: 0, possible: 0,
        goals: 0, pens: 0, own: 0, assists: 0, yellow: 0, yellowRed: 0, red: 0 });
      const ps = st.stats[p.id];
      const started = m.startingIds.indexOf(p.id) !== -1;
      a.squad++; a.possible += total; a.min += ps.played;
      if(started) a.starts++;
      if(started || subbedIn.has(p.id) || ps.played > 0) a.apps++;
      a.goals += ps.goals; a.pens += ps.pens; a.own += ps.own; a.assists += ps.assists;
      a.yellow += ps.yellow; a.yellowRed += ps.yellowRed; a.red += ps.red;
    });
  });
  const players = Object.keys(P).map(id => {
    const a = P[id];
    a.share = a.possible ? Math.round(a.min / a.possible * 100) : 0;
    a.avg = a.apps ? Math.round(a.min / a.apps / 60000) : 0;
    a.minutes = Math.round(a.min / 60000);
    a.cards = a.yellow + a.yellowRed * 2 + a.red * 3;
    return a;
  });
  const field = players.filter(a => !a.keeper && a.squad);
  const fairAvg = field.length ? Math.round(field.reduce((x, a) => x + a.share, 0) / field.length) : 0;
  return { matches: ms, live, all, home, away, players, fairAvg };
}
const STAT_SORT = {

const pLabel = p => p ? (p.number != null ? p.number + ' ' + p.name : p.name) : T().unknown;
const pShort = p => p ? (p.number != null ? p.number + ' ' : '') + p.name.split(' ')[0] : '?';
const findP = (m, id) => id ? (m.ownPlayers.find(p => p.id === id) || m.oppPlayers.find(p => p.id === id)) : null;
const teamName = (m, side) => side === 'own' ? m.ownName : m.oppName;
const scoreText = (m, s) => m.isHome ? s.own + ':' + s.opp : s.opp + ':' + s.own;
const cardName = c => ({ yellow: T().yellow, yellowRed: T().yellowRed, red: T().red })[c];

function describe(m, e){
  const t = T();
  if(e.type === 'goal'){
    const who = e.playerId ? pLabel(findP(m, e.playerId)) : teamName(m, e.side);
    if(e.kind === 'ownGoal'){
      const ogTeam = teamName(m, e.side === 'own' ? 'opp' : 'own');
      return e.playerId ? t.evOwn(who, ogTeam) : t.evOwn(ogTeam, '');
    }
    return t.evGoal(who, e.kind === 'penalty') + (e.kind === 'normal' && e.assistId && findP(m, e.assistId) ? ' (' + t.assistBy(pLabel(findP(m, e.assistId))) + ')' : '');
  }
  if(e.type === 'card') return cardName(e.card) + ' ' + (e.playerId ? pLabel(findP(m, e.playerId)) : teamName(m, e.side));
  if(e.type === 'keeper') return t.evKeeper(pLabel(findP(m, e.playerId)));
  if(!e.outId) return t.evIn(pLabel(findP(m, e.inId)));
  return t.evSub(pLabel(findP(m, e.inId)), pLabel(findP(m, e.outId)));
}
function evColor(e){
  if(e.type === 'goal') return e.side === 'own' ? 'var(--green)' : 'var(--opp)';
  if(e.type === 'card') return e.card === 'yellow' ? 'var(--yellow)' : e.card === 'red' ? 'var(--red)' : 'var(--amber)';
  return 'var(--line)';
}
function buildReport(m, nowGame){
  const t = T();
  const st = derive(m, nowGame);
  const home = m.isHome ? m.ownName : m.oppName, away = m.isHome ? m.oppName : m.ownName;
  const L = [];
  const ht = st.halfTime && m.settings.periods === 2 ? ' (' + scoreText(m, st.halfTime) + ')' : '';
  const so = shootoutScore(m);
  L.push('⚽ ' + home + ' – ' + away + '  ' + scoreText(m, st.score) + ht + (m.extra && !so ? ' ' + t.aetShort : '') + (so ? ' – ' + scoreText(m, so) + ' ' + t.soShort : ''));
  L.push(fmtDate(matchDate(m)));
  const evs = sortEvents(m.events), run = { own: 0, opp: 0 }, pm = m;
  const goals = evs.filter(e => e.type === 'goal');
  if(goals.length){
    L.push('', t.rGoals);
    goals.forEach(g => { run[g.side]++; L.push(fmtMinute(g, pm) + '  ' + scoreText(m, run) + '  ' + describe(m, g)); });
  }
  const cards = evs.filter(e => e.type === 'card');
  if(cards.length){ L.push('', t.rCards); cards.forEach(c => L.push(fmtMinute(c, pm) + '  ' + describe(m, c) + (c.side === 'opp' && c.playerId ? ' (' + m.oppName + ')' : ''))); }
  const subs = evs.filter(e => e.type === 'sub');
  if(subs.length){ L.push('', t.rSubs); subs.forEach(s => L.push(fmtMinute(s, pm) + '  ' + describe(m, s) + (s.side === 'opp' ? ' (' + m.oppName + ')' : ''))); }
  if(m.notesShare && m.notes && m.notes.trim()) L.push('', t.notes, m.notes.trim());
  L.push('', t.playTimes(m.ownName));
  m.ownPlayers.slice().sort((a, b) => st.stats[b.id].played - st.stats[a.id].played)
    .forEach(p => L.push(pLabel(p) + ': ' + Math.round(st.stats[p.id].played / 60000) + ' min'));
  return L.join('\n');
}

/* ---------------------------------------------------------------------
   TEXT-IMPORT
   1) Spieltag aus dem Kaderplaner - derselbe Text, den TacticBoard
      versteht ("Team · Datum", "Heimspiel gegen X", "Kader (n)", "1. Name (TW)").
      Zusaetzlich verstanden: Abschnitte "Startelf"/"Aufstellung"/"Start"
      und "Bank", damit eine Aufstellung uebergeben werden kann.
   2) Freie Namensliste (DFBnet, Excel, WhatsApp ...).
--------------------------------------------------------------------- */
function parseMatchday(text){
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const RE_HEADER = /^\*?\s*(.+?)\s*·\s*(.+?)\s*\*?$/;
  const RE_SECTION = /^\*?\s*(Kader|Squad|Startelf|Start(?:aufstellung)?|Aufstellung|Lineup|Starting(?:\s+XI)?|Bank|Bench|Ersatz(?:bank)?)\s*(?:\((\d+)\))?\s*:?\s*\*?$/i;
  const RE_PLAYER = /^\s*(\d{1,2})[.)]\s+(.+?)\s*$/;
  const RE_OPP = /\b(?:gegen|vs\.?|against)\s+(.+?)\s*$/i;
  const RE_HOME = /^\s*(Heimspiel|Ausw[äa]rtsspiel|Home|Away)\b/i;
  const RE_DATE = /(\d{1,2}\.\d{1,2}\.\d{0,4})/;
  const RE_KEEPER = /\s*\((TW|GK|Torwart|Keeper)\)\s*$/i;
  const blocks = [];
  let cur = null, sec = '';
  const finish = () => { if(cur && cur.players.length) blocks.push(cur); cur = null; sec = ''; };
  for(const raw of lines){
    const line = raw.trim();
    const h = line.match(RE_HEADER);
    if(h && RE_DATE.test(h[2]) && !RE_PLAYER.test(line)){
      finish();
      cur = { team: h[1].replace(/\*/g, '').trim().slice(0, 50), date: h[2].trim(), opponent: '', home: null, players: [], hasLineup: false };
      continue;
    }
    if(!cur) continue;
    const s = line.match(RE_SECTION);
    if(s){
      const w = s[1].toLowerCase();
      sec = /^(bank|bench|ersatz)/.test(w) ? 'bench' : /^(kader|squad)/.test(w) ? 'squad' : 'start';
      if(sec !== 'squad') cur.hasLineup = true;
      continue;
    }
    if(!sec){
      const hm = line.match(RE_HOME); if(hm) cur.home = /^(Heim|Home)/i.test(hm[1]);
      const om = line.match(RE_OPP);  if(om) cur.opponent = om[1].replace(/\s*\((Freundschaftsspiel|friendly)\)\s*$/i, '').replace(/\*/g, '').trim().slice(0, 50);
      continue;
    }
    if(line === '') continue;
    const pm = line.match(RE_PLAYER);
    if(pm){
      let name = pm[2].replace(/\*/g, '').trim();
      const keeper = RE_KEEPER.test(name);
      if(keeper) name = name.replace(RE_KEEPER, '').trim();
      // "7 Luca" hinter der Aufzaehlung = Trikotnummer
      let number = null;
      const nr = name.match(/^#?(\d{1,2})\s+(.+)$/) || name.match(/^(.+?)\s+#(\d{1,2})$/);
      if(nr){ if(/^\d/.test(nr[1])){ number = +nr[1]; name = nr[2]; } else { number = +nr[2]; name = nr[1]; } }
      if(name && cur.players.length < 40) cur.players.push({ name: name.slice(0, 40), number, keeper, role: sec });
    } else {
      sec = '';
    }
  }
  finish();
  return blocks;
}

function parseRoster(text){
  const days = parseMatchday(text);
  if(days.length) return days[0].players.map(p => ({ name: p.name, number: p.number, keeper: p.keeper }));
  const out = [], seen = new Set();
  const HEADER = /^(name|nachname|vorname|spieler(in)?(:innen)?|players?|nr\.?|no\.?|rückennummer|kader|squad|trikot)$/i;
  const DATE = /\b\d{1,2}\.\d{1,2}\.(\d{2}|\d{4})\b/g;
  const KEEPER = /\s*\((TW|GK|Torwart|Keeper)\)\s*/i;
  let lines = String(text || '').replace(/\r/g, '').split('\n');
  // Schlicht durchgezaehlte Liste (1. 2. 3. ...)? Dann sind die Ziffern keine Trikotnummern.
  const lead = lines.map(l => l.trim()).filter(Boolean).map(l => (l.match(/^(\d{1,2})[.)]\s/) || [])[1]);
  const enumerated = lead.length > 2 && lead.every((n, i) => n != null && +n === i + 1);
  for(const raw of lines){
    let line = raw.replace(DATE, ' ').replace(/[*_]/g, '').trim();
    if(!line) continue;
    let keeper = KEEPER.test(line);
    line = line.replace(KEEPER, ' ').trim();
    if(enumerated) line = line.replace(/^\d{1,2}[.)]\s+/, '');
    const cells = line.split(/\t|;|\s\|\s/).map(c => c.trim()).filter(Boolean);
    let number = null; const names = [];
    for(const c of cells){
      if(/^#?\d{1,2}\.?$/.test(c) && number == null) number = parseInt(c.replace(/\D/g, ''), 10);
      else if(/[a-zA-ZÀ-ž]/.test(c)) names.push(c);
    }
    if(!names.length) continue;
    let name = names[0];
    if(cells.length > 1 && names.length >= 2 && !/[ ,]/.test(name) && /^[A-ZÄÖÜ][a-zäöüß-]+$/.test(names[1])) name = names[1] + ' ' + name;
    const ld = name.match(/^#?(\d{1,2})[.):\-\s]+\s*(.+)$/);
    if(ld){ if(number == null) number = +ld[1]; name = ld[2]; }
    const tr = name.match(/^(.+?)\s*(?:\(#?(\d{1,2})\)|#(\d{1,2})|\s(\d{1,2}))$/);
    if(tr){ if(number == null) number = +(tr[2] || tr[3] || tr[4]); name = tr[1]; }
    name = name.replace(/^[-–•*·]+\s*/, '').replace(/\s+/g, ' ').trim();
    const cm = name.match(/^([^,]+),\s*([^,]+)$/);
    if(cm) name = cm[2] + ' ' + cm[1];
    if(!name || HEADER.test(name) || name.length > 40) continue;
    const key = name.toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key);
    out.push({ name, number: isFinite(number) ? number : null, keeper });
  }
  return out;
}

function teamsFromSquadFile(data){
  if(!data || data.kind !== 'squads' || !Array.isArray(data.squads)) return [];
  return data.squads.map(k => {
    if(!k || typeof k !== 'object') return null;
    const players = (Array.isArray(k.players) ? k.players : []).map(p => p && cleanPlayer({
      id: p.id, name: p.name, number: p.nr === '' ? null : p.nr, keeper: p.role === 'tw', sel: p.sel !== false,
      tb: { role: p.role, captain: p.captain === true }
    })).filter(Boolean);
    const tb = { form: String(k.form || ''), formation: String(k.formation || ''), showNr: k.showNr === true };
    if(k.sportEinst && typeof k.sportEinst === 'object') tb.sportEinst = k.sportEinst;
    return { name: String(k.name || '').trim().slice(0, 50), players, tb };
  }).filter(t => t && t.name);
}
function mergeTeam(name, players, isOwn, tb){
  let team = DB.teams.find(t => t.name.toLowerCase() === name.toLowerCase());
  let created = false;
  if(!team){ team = { id: uid(), name, isOwn: isOwn !== false, players: [] }; DB.teams.push(team); created = true; }
  if(tb) team.tb = tb;
  players.forEach(np => {
    const p = team.players.find(x => x.name.toLowerCase() === np.name.toLowerCase());
    if(p){
      if(np.number != null) p.number = np.number;
      if(np.keeper) p.keeper = true;
      if(np.sel != null) p.sel = np.sel;
      if(np.tb){ p.tb = np.tb; p.keeper = np.tb.role === 'tw'; }
    } else if(team.players.length < 60){
      const id = np.id && !team.players.some(x => x.id === np.id) ? np.id : uid();
      team.players.push(cleanPlayer(Object.assign({}, np, { id })));
    }
  });
  return { team, created };
}
function squadFileFor(teams){
  return {
    app: 'PitchPro', kind: 'squads', version: 1,
    squads: teams.map(t => {
      const tb = t.tb || {};
      const last = DB.lastSettings || DEFAULT_SETTINGS;

      const k = {
        id: t.id, name: t.name, showNr: tb.showNr != null ? tb.showNr : true,
        form: ['4', '6', '8', '10', 'free'].indexOf(f) !== -1 ? f : '6', formation: tb.formation || '',
        players: t.players.map(p => {
          const pr = p.tb || {};
          // Torwart aus PitchPro hat Vorrang, sonst die Rolle aus TacticBoard
          const role = p.keeper ? 'tw' : (pr.role && pr.role !== 'tw' ? pr.role : '');
          return { id: p.id, name: p.name.slice(0, 30), nr: p.number == null ? '' : String(p.number),
                   role, captain: pr.captain === true, sel: p.sel !== false };
        })
      };
      if(tb.sportEinst) k.sportEinst = tb.sportEinst;
      return k;
    })
  };
}

/* Auf dem iPad braucht das Teilen-Fenster einen Ankerpunkt (wie in TacticBoard) */
function iPadAnchor(){
  return Math.max(0, Math.round(window.innerWidth / 2)) + ',' + Math.max(0, Math.round(window.innerHeight * 0.66)) + ',0,0';
}
async function shareText(text, title){
  if(window.TbShare && window.TbShare.shareText){
    try { await window.TbShare.shareText(text, title || ''); return; } catch(e){}
  }
  const ss = window.plugins && window.plugins.socialsharing;
  if(window.cordova && ss && ss.shareWithOptions){
    ss.shareWithOptions({ message: text, subject: title || '', iPadPopupCoordinates: iPadAnchor() }, () => {}, () => {});
    return;
  }
  if(navigator.share){
    try { await navigator.share({ text, title }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast(T().copied); }
  catch(e){ openSheet(title || '', '', '<textarea class="in" readonly>' + esc(text) + '</textarea>'); }
}
function blobToBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
async function saveFile(obj, name){
  return saveBlob(new Blob([JSON.stringify(obj)], { type: 'application/json' }), name, 'application/json');
}
async function saveBlob(blob, name, mime){
  if(window.TbShare && window.TbShare.saveFile){
    const b64 = await blobToBase64(blob);
    return await window.TbShare.saveFile(name, mime, b64) ? 'downloads' : '';
  }
  const ss = window.plugins && window.plugins.socialsharing;
  if(window.cordova && ss && ss.shareWithOptions){
    const dataUrl = 'df:' + name + ';data:' + mime + ';base64,' + await blobToBase64(blob);
    return new Promise((res, rej) => ss.shareWithOptions({ subject: name, files: [dataUrl], chooserTitle: name, iPadPopupCoordinates: iPadAnchor() },
      r => res(r && r.completed === false ? 'abbruch' : ''), e => rej(new Error(String(e || 'share')))));
  }
  if(IST_IOS && navigator.canShare){
    try {
      const f = new File([blob], name, { type: mime });
      if(navigator.canShare({ files: [f] })){ await navigator.share({ files: [f] }); return ''; }
    } catch(e){ if(e && e.name === 'AbortError') return 'abbruch'; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.download = name; a.href = url; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return '';
}

    if(b){ r.hidden = false; r.textContent = b.label; r.dataset.act = b.act; r.setAttribute('aria-label', b.aria || b.label); }
    else { r.hidden = true; delete r.dataset.act; }
  });
}

let rendering = false;
function render(resetScroll){
  if(rendering) return;
  rendering = true;
  try { renderNow(resetScroll); } finally { rendering = false; }
}
function renderNow(resetScroll){
  // Fokus vorher loesen: sonst feuert beim Austausch des Inhalts ein
  // blur/change mitten im Neuaufbau
  const fe = document.activeElement;
  if(fe && fe !== document.body && $('view').contains(fe)) fe.blur();
  const r = cur();
  const view = $('view');
  const keep = view.scrollTop;
  let html = '';
  if(r.v === 'home') html = viewHome();
  else if(r.v === 'teams') html = viewTeams();
  else if(r.v === 'team') html = viewTeam(r);
  else if(r.v === 'new') html = viewNew(r);
  else if(r.v === 'live') html = viewLive(r);
  else if(r.v === 'report') html = viewReport(r);
  else if(r.v === 'stats') html = viewStats(r);
  else if(r.v === 'about') html = viewAbout();
  view.innerHTML = '<div class="wrap">' + html + '</div>';
  view.scrollTop = resetScroll ? 0 : keep;
  const board = view.querySelector('.board');
  if(board && view.scrollTop > 80) board.classList.add('compact');
  if(r.v === 'live') tick(true);
}

/* Sicherung faellig? Erst ab 3 abgeschlossenen Spielen seit der letzten
   Sicherung und fruehestens 30 Tage danach - sonst nervt der Hinweis. */
function backupDue(now){
  now = now || Date.now();
  if(now < (DB.backupSnoozeUntil || 0)) return null;
  const since = DB.lastBackupAt || 0;
  const fresh = DB.matches.filter(m => m.clock.status === 'finished' && matchDate(m) > since);
  if(fresh.length < 3) return null;
  if(since && now - since < 30 * 86400000) return null;
  return { never: !since, days: since ? Math.floor((now - since) / 86400000) : 0, n: fresh.length };
}

function newDraft(extra){

  const d = Object.assign({ v: 'new', ownId: at ? at.id : own[0] && own[0].id, oppId: null, oppName: '', isHome: true,

  const team = teamById(d.ownId);
  const tf = team && team.tb ? parseInt(team.tb.form, 10) : NaN;
  if(isFinite(tf) && tf >= 1 && tf <= 10) d.settings.playersOnField = tf + 1;
  if(team && !extra){

function viewLive(r){
  const t = T();
  const m = matchById(r.id);
  if(!m){ setTop(t.live); return '<div class="empty">–</div>'; }
  setTop(t.live, { label: t.report, act: 'goReport' });
  const now = Date.now(), c = m.clock, s = m.settings;
  const st = derive(m, Clock.game(c, now));
  const home = m.isHome ? m.ownName : m.oppName, away = m.isHome ? m.oppName : m.ownName;
  const last = c.period >= totalPeriods(m);
  const endLabel = last ? t.fullTime : (s.periods === 2 && c.period === 1 ? t.halfTime : t.endPeriod);
  let ctr = '';
  if(c.status === 'pre') ctr = '<button class="btn lg" data-act="clock" data-a="start">▶ ' + esc(t.kickoff) + '</button>';
  else if(c.status === 'running') ctr = '<button class="btn" data-act="clock" data-a="pause">' + esc(t.pause) + '</button>' +
    '<button class="btn danger" data-act="endPeriod">' + esc(endLabel) + '</button>';
  else if(c.status === 'paused') ctr = '<button class="btn" data-act="clock" data-a="start">▶ ' + esc(t.resume) + '</button>' +
    '<button class="btn danger" data-act="endPeriod">' + esc(endLabel) + '</button>';
  else if(c.status === 'break') ctr = '<button class="btn" data-act="clock" data-a="start">▶ ' + esc(t.kickoffP(periodLabelM(m, c.period + 1))) + '</button>';
  else ctr = '<button class="btn" data-act="goReport">' + esc(t.viewReport) + '</button>';

  const so = shootoutScore(m);
  let h = '<div class="board"><div class="score-row"><div class="tn r">' + esc(home) + '</div><div class="score num">' +
    scoreText(m, st.score) + '</div><div class="tn">' + esc(away) + '</div></div>' +
    (so ? '<div class="status num" style="font-size:15px;color:#fff">' + esc(t.soShort) + ' ' + scoreText(m, so) + '</div>' : '') +
    '<button class="clock num" id="clock" data-act="clockFix">' + displayClock(m, now) + '</button>' +
    '<div class="status" id="status"></div><div class="ctrls">' + ctr + '</div></div>';

  if(c.status === 'finished' && st.score.own === st.score.opp && !m.shootout){
    h += '<div class="row2" style="margin-top:16px">' + (!m.extra ? '<button class="btn soft" data-act="extraTime">' + esc(t.extraTime) + '</button>' : '') +
      '<button class="btn soft" data-act="shootoutStart">' + esc(t.shootout) + '</button></div>';
  }
  if(m.shootout) h += shootoutPanel(m);

  // Wechselerinnerung
  const rem = msUntilReminder(m, now);
  const due = rem != null && rem <= 0 && (c.status === 'running' || c.status === 'paused');
  // Wechselvorschlaege nur, solange gespielt wird (auch in der Pause), nicht vor Anpfiff/nach Abpfiff
  const sugg = s.fairPlay && c.status !== 'pre' && c.status !== 'finished' ? suggestSubs(m, st) : [];
  r.due = due;

    h += '<div class="due"><h3>' + esc(t.subDue) + '</h3>' + (sugg.length ? sugg.map(x => '<div class="sug"><span>⬆ ' + esc(pShort(findP(m, x.inId))) +

      esc(t.doSub) + '</button></div>').join('') : '<div style="margin-bottom:8px">' + esc(t.tapToSub) + '</div>') +
      '<button class="btn ghost" data-act="ackReminder">' + esc(t.later) + '</button></div>';
  } else if(rem != null || (sugg.length && c.status !== 'pre')){
    h += '<div class="next">' + (rem != null ? esc(t.nextReminder) + ' <b class="num" id="countdown">' + fmtClock(Math.max(0, rem)) + '</b>' : '') +
      (sugg.length ? '<div class="s">' + esc(t.suggestion) + ': ' + esc(pShort(findP(m, sugg[0].inId))) + ' ' + esc(t.forP) + ' ' + esc(pShort(findP(m, sugg[0].outId))) + '</div>' : '') + '</div>';
  }

  const share = s.fairPlay ? fairShare(m) : 0;
  const tile = (id, bench) => {
    const p = findP(m, id), ps = st.stats[id];
    return '<button class="tile' + (bench ? ' bench' : '') + '" data-act="ownPlayer" data-id="' + id + '"><div class="top"><span class="n num">' +
      (p.number == null ? '–' : p.number) + '</span>' + (st.keeperId === id ? '<span class="twb">TW</span>' : '') +
      '<span class="m num" data-min="' + id + '">' + Math.floor(ps.played / 60000) + "'</span></div>" +
      '<div class="nm">' + esc(p.name) + '</div>' + badges(ps) +
      (share ? '<div class="bar"><i data-bar="' + id + '" style="width:' + Math.min(100, ps.played / share * 100) + '%"></i></div>' : '') + '</button>';
  };
  h += '<div class="sec"><h2>' + esc(t.onPitch) + ' · ' + esc(m.ownName) + '</h2><span class="meta num">' + st.onField.length + '/' + s.playersOnField + '</span></div>' +

function shootoutScore(m){
  if(!m.shootout || !m.shootout.length) return null;
  const s = { own: 0, opp: 0 };

  return s;
}

/* Ergebnis aus Sicht des eigenen Teams: 1 Sieg, 0 Unentschieden, -1 Niederlage */
function matchResult(m, score){
  if(score.own !== score.opp) return score.own > score.opp ? 1 : -1;
  const so = shootoutScore(m);
  if(so && so.own !== so.opp) return so.own > so.opp ? 1 : -1;
  return 0;
}

/* ---------------------------------------------------------------------
   LIVE-TICK: aktualisiert nur Uhr, Minuten und Countdown – kein
   Neuaufbau, damit Tippen und Scrollen nicht gestoert werden.
--------------------------------------------------------------------- */
let wakeLock = null, lastDue = false;
let awakeNative = null;
async function keepAwake(on){
  const ins = window.plugins && window.plugins.insomnia;
  if(ins){
    // Cordova-Plugin: zuverlaessig auf Android und iOS
    if(awakeNative !== on){ awakeNative = on; try { on ? ins.keepAwake() : ins.allowSleepAgain(); } catch(e){} }
    return;
  }
  try {
    if(on && !wakeLock && navigator.wakeLock && document.visibilityState === 'visible'){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){ wakeLock = null; }
}
let audioCtx = null;
/* iOS (und Chrome) spielen Ton erst nach einer Beruehrung ab. Deshalb wird der
   AudioContext beim Anpfiff bzw. beim ersten Tippen angelegt und entsperrt. */
function unlockAudio(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}
function beep(){
  try {
    unlockAudio();
    [0, 0.35, 0.7].forEach(off => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + off;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      o.start(t0); o.stop(t0 + 0.26);
    });
  } catch(e){}
}
function tick(first){
  const r = cur();
  keepAwake(DB.matches.some(x => x.clock.status === 'running'));
  if(r.v !== 'live') return;
  const m = matchById(r.id);
  if(!m) return;
  const now = Date.now(), c = m.clock, s = m.settings;
  const rem = msUntilReminder(m, now);
  const due = rem != null && rem <= 0 && (c.status === 'running' || c.status === 'paused');
  if(due && !lastDue && !first){ vibrate([400, 200, 400, 200, 400]); beep(); }
  lastDue = due;
  // Neuaufbau, wenn sich der Hinweis aendert - aber nicht mitten im Tippen der
  // Notizen (das wuerde die Tastatur schliessen); dann beim naechsten Tick.
  const typing = document.activeElement && document.activeElement.id === 'notes';
  if(!first && due !== r.due && !typing){ render(false); return; }
  const ck = $('clock');
  if(ck){
    ck.textContent = displayClock(m, now);
    ck.classList.toggle('over', c.status === 'running' && Clock.periodElapsed(c, now) > periodLen(m, c.period) * 60000);
  }
  const t = T();
  const stt = $('status');
  if(stt) stt.textContent = c.status === 'pre' ? t.beforeKick : c.status === 'break' ? breakLabelM(m, c.period) :
    c.status === 'finished' ? t.fullTime : periodLabelM(m, c.period) + (c.status === 'paused' ? ' · ' + t.paused : '');
  const cd = $('countdown');
  if(cd && rem != null) cd.textContent = fmtClock(Math.max(0, rem));
  if(c.status === 'running'){
    const st = derive(m, Clock.game(c, now));
    const share = s.fairPlay ? fairShare(m) : 0;
    document.querySelectorAll('[data-min]').forEach(el => {
      const ps = st.stats[el.dataset.min]; if(ps) el.textContent = Math.floor(ps.played / 60000) + "'";
    });
    if(share) document.querySelectorAll('[data-bar]').forEach(el => {
      const ps = st.stats[el.dataset.bar]; if(ps) el.style.width = Math.min(100, ps.played / share * 100) + '%';
    });
  }
}
/* ---------------------------------------------------------------------
   WECHSELERINNERUNG ALS BENACHRICHTIGUNG (App im Hintergrund / Display aus)
   Nutzt cordova-plugin-local-notification. Geplant wird immer nur die
   naechste Erinnerung des laufenden Spiels; jede Aenderung (Pause, Wechsel,
   "Erledigt") plant neu. Im Browser gibt es das Plugin nicht - dann nichts.
--------------------------------------------------------------------- */
const NOTIFY_ID = 1;
let notifyPlanned = null;   // { matchId, at }
function notifyApi(){
  return window.cordova && window.cordova.plugins && window.cordova.plugins.notification && window.cordova.plugins.notification.local;
}
function syncNotification(now){
  const ln = notifyApi();
  if(!ln) return;
  const m = DB.matches.find(x => x.clock.status === 'running');
  let at = null;
  if(m){
    const rem = msUntilReminder(m, now);
    // Gleich faellig: geplante Benachrichtigung stehen lassen. Laeuft das
    // JavaScript im Hintergrund weiter (Android), wuerde sie sonst kurz vor
    // dem Ausloesen wieder geloescht.
    if(rem != null && rem <= 2000 && notifyPlanned && notifyPlanned.matchId === m.id) return;
    if(rem != null && rem > 2000) at = now + rem;
  }
  if(at == null){
    if(notifyPlanned){ notifyPlanned = null; try { ln.cancel(NOTIFY_ID); } catch(e){} }
    return;
  }
  if(notifyPlanned && notifyPlanned.matchId === m.id && Math.abs(notifyPlanned.at - at) < 3000) return;
  notifyPlanned = { matchId: m.id, at };
  const t = T();
  try {
    ln.cancel(NOTIFY_ID, () => {
      ln.schedule({ id: NOTIFY_ID, title: t.subDue, text: m.ownName + ' – ' + m.oppName + ': ' + t.notifyText,
        trigger: { at: new Date(at) }, iOSForeground: false,
        androidChannelId: 'pitchpro_subs', androidChannelName: t.notifyChannel, androidChannelImportance: 'IMPORTANCE_HIGH' });
    });
  } catch(e){ notifyPlanned = null; }
}

/* Kompakte Tafel beim Scrollen. Mit Abstand zwischen Ein- und Ausschalten,
   denn die kleinere Tafel verkuerzt die Seite - sonst flackert es. */
function updateCompact(){
  const v = $('view'), b = v.querySelector('.board');
  if(!b) return;
  const room = v.scrollHeight - v.clientHeight;
  if(!b.classList.contains('compact') && v.scrollTop > 80 && room > 300) b.classList.add('compact');
  else if(b.classList.contains('compact') && v.scrollTop < 8) b.classList.remove('compact');
}

  applyMatchday(){
    const t = T();

    if(!days.length){ toast(t.matchdayNone); return; }
    const md = days[0];
    const { team, created } = mergeTeam(md.team, md.players.map(p => ({ name: p.name, number: p.number, keeper: p.keeper })), true);
    team.isOwn = true;
    DB.activeTeamId = team.id;

    const d = newDraft({ ownId: team.id, oppName: md.opponent || '', isHome: md.home !== false, note: t.fromMatchday });
    const opp = md.opponent && DB.teams.find(x => !x.isOwn && x.name.toLowerCase() === md.opponent.toLowerCase());
    if(opp) d.oppId = opp.id;
    const byName = n => team.players.find(p => p.name.toLowerCase() === n.toLowerCase());
    team.players.forEach(p => { d.roles[p.id] = 'absent'; });
    md.players.forEach(mp => {
      const p = byName(mp.name); if(!p) return;
      d.roles[p.id] = mp.role === 'start' ? 'start' : 'bench';
      if(mp.keeper) d.keeperId = p.id;
    });
    // Ohne Startelf-Abschnitt: passt der Kader aufs Feld, starten alle
    const present = md.players.length;
    if(!md.hasLineup && present <= d.settings.playersOnField) md.players.forEach(mp => { const p = byName(mp.name); if(p) d.roles[p.id] = 'start'; });
    // Ohne Aufstellung steht zumindest der Torwart schon in der Startelf
    if(!md.hasLineup && d.keeperId) d.roles[d.keeperId] = 'start';

    if(created) toast(t.matchdayTeamNew(team.name));

  ownPlayer(el){
    const t = T(), m = curMatch(), id = el.dataset.id, p = findP(m, id);
    const st = derive(m, Clock.game(m.clock, Date.now()));
    const on = st.onField.indexOf(id) !== -1;
    let b = '';
    if(on) b += act('ev', t.goal, '', 'var(--green)', ' data-k="goal" data-side="own" data-kind="normal" data-p="' + id + '"') +
      act('ev', t.penGoal, '', 'var(--green)', ' data-k="goal" data-side="own" data-kind="penalty" data-p="' + id + '"') +
      act('ev', t.ownGoal, t.countsFor(m.oppName), 'var(--opp)', ' data-k="goal" data-side="opp" data-kind="ownGoal" data-p="' + id + '"');
    b += act('ev', t.yellow, '', 'var(--yellow)', ' data-k="card" data-side="own" data-card="yellow" data-p="' + id + '"') +
      act('ev', t.yellowRed, '', 'var(--amber)', ' data-k="card" data-side="own" data-card="yellowRed" data-p="' + id + '"') +
      act('ev', t.red, '', 'var(--red)', ' data-k="card" data-side="own" data-card="red" data-p="' + id + '"');
    b += on ? act('subPick', t.subOut, t.subOutHint, '', ' data-mode="out" data-p="' + id + '"')
            : act('subPick', t.subIn, t.subInHint, '', ' data-mode="in" data-p="' + id + '"');
    // Platz frei (z. B. mit weniger Spielern begonnen)? Dann ohne Auswechslung aufs Feld.
    // Platzverweise verkleinern die erlaubte Zahl.
    if(!on && st.sentOff.indexOf(id) === -1 && st.onField.length < m.settings.playersOnField - st.sentOff.length)
      b += act('subDo', t.addToField, t.addToFieldHint, 'var(--green)', ' data-o="" data-i="' + id + '"');
    if(on && st.keeperId !== id) b += act('setKeeper', t.markKeeper, t.markKeeperHint, '', ' data-p="' + id + '"');

  ev(el){
    const m = curMatch(), ds = el.dataset;
    if(ds.k === 'goal'){
      const eid = pushEvent(m.id, { type: 'goal', side: ds.side, kind: ds.kind, playerId: ds.p || null });
      // Vorlage gleich abfragen (eigenes Tor aus dem Spiel heraus, Option im Spiel aktiv)
      if(m.settings.assists && ds.side === 'own' && ds.kind === 'normal'){ render(false); openAssistPicker(curMatch(), eid, ds.p); return; }
    } else {
      let card = ds.card;
      // Zweite Gelbe fuer denselben Spieler = Gelb-Rot (Regelwerk)
      if(card === 'yellow' && ds.p && m.events.some(e => e.type === 'card' && e.card === 'yellow' && e.playerId === ds.p)){
        card = 'yellowRed'; toast(T().secondYellow);
      }
      pushEvent(m.id, { type: 'card', side: ds.side, card, playerId: ds.p || null });
    }
    closeSheet(); render(false);

  setWho(el){
    const id = sheetCtx.eventId;
    patchEvent(cur().id, id, e => { e.playerId = el.dataset.p || null; if(e.assistId && e.assistId === e.playerId) e.assistId = null; return e; });
    refreshEventSheet(id);
  },
  editAssist(){
    const t = T(), m = curMatch(), id = sheetCtx.eventId, e = m.events.find(x => x.id === id);
    openSheet(t.changeAssist, describe(m, e), act('setAssistEdit', t.noAssist, '', '', ' data-p=""') +
      m.ownPlayers.filter(p => p.id !== e.playerId).sort(byNumber).map(p => act('setAssistEdit', pLabel(p), '', '', ' data-p="' + p.id + '"')).join(''), { eventId: id });
  },
  setAssistEdit(el){
    const id = sheetCtx.eventId;
    patchEvent(cur().id, id, e => Object.assign(e, { assistId: el.dataset.p || null }));
    refreshEventSheet(id);
  },
  delEvent(el){ patchMatch(cur().id, x => Object.assign({}, x, { events: x.events.filter(e => e.id !== el.dataset.id) })); closeSheet(); render(false); },
  clockFix(){
    const t = T(), m = curMatch();
    if(m.clock.status === 'pre') return;
    const can = m.clock.status === 'running' || m.clock.status === 'paused';
    openSheet(t.clockFix, can ? t.clockFixSub : '', can ? '<div class="row2">' + [-60000, -10000, 10000, 60000].map(ms =>
      '<button class="btn soft" data-act="adjust" data-ms="' + ms + '">' + (ms > 0 ? '+' : '−') + (Math.abs(ms) >= 60000 ? '1 min' : '10 s') + '</button>').join('') + '</div>' +
      '<div class="clock num" id="clock-prev" style="margin-top:10px">' + displayClock(m, Date.now()) + '</div>'
      : '<div class="empty">' + esc(t.clockNoFix) + '</div>' +
        (m.shootout ? '' : '<button class="btn soft" data-act="reopen">' + esc(m.clock.status === 'finished' ? t.undoFullTime : t.undoBreak) + '</button><div class="hint">' + esc(t.undoHint) + '</div>') +
        (m.extra && m.clock.status === 'break' && m.clock.period === m.settings.periods ? '<button class="btn ghost" data-act="extraCancel" style="margin-top:8px">' + esc(t.extraCancel) + '</button>' : ''));
  },
  extraTime(){
    const t = T(), m = curMatch();
    const sug = m.settings.periodMinutes >= 40 ? 15 : m.settings.periodMinutes >= 30 ? 10 : 5;
    openSheet(t.extraTime, t.extraSub, '<div class="chips" style="margin-bottom:10px">' + [5, 10, 15].map(x =>
      '<button class="chip' + (x === sug ? ' on' : '') + '" data-act="extraPick" data-v="' + x + '">2 × ' + x + ' min</button>').join('') + '</div>' +
      '<button class="btn" data-act="extraStart" data-v="' + sug + '" id="extra-go">' + esc(t.extraGo(sug)) + '</button>');
  },
  extraPick(el){
    document.querySelectorAll('#sheet [data-act="extraPick"]').forEach(c => c.classList.toggle('on', c === el));
    const b = $('extra-go'); b.dataset.v = el.dataset.v; b.textContent = T().extraGo(+el.dataset.v);
  },
  extraStart(el){
    const mins = +el.dataset.v;
    patchMatch(cur().id, x => x.clock.status !== 'finished' || x.extra ? x :
      Object.assign({}, x, { extra: { periods: 2, minutes: mins }, clock: Object.assign({}, x.clock, { status: 'break' }) }));
    closeSheet(); render(false);
  },
  extraCancel(){
    patchMatch(cur().id, x => x.extra && x.clock.status === 'break' && x.clock.period === x.settings.periods
      ? Object.assign({}, x, { extra: null, clock: Object.assign({}, x.clock, { status: 'finished' }) }) : x);
    closeSheet(); render(false);
  },
  shootoutStart(){ patchMatch(cur().id, x => x.clock.status === 'finished' && !x.shootout ? Object.assign({}, x, { shootout: [] }) : x); render(false); },
  shootoutCancel(){ patchMatch(cur().id, x => x.shootout && !x.shootout.length ? Object.assign({}, x, { shootout: null }) : x); render(false); },
  kick(el){
    patchMatch(cur().id, x => Object.assign({}, x, { shootout: (x.shootout || []).concat([{ id: uid(), side: el.dataset.side === 'opp' ? 'opp' : 'own', scored: el.dataset.v === '1' }]) }));
    vibrate(30); render(false);
  },
  kickUndo(){ patchMatch(cur().id, x => Object.assign({}, x, { shootout: (x.shootout || []).slice(0, -1) })); render(false); },
  reopen(){
    patchMatch(cur().id, x => {
      // Abpfiff vor der Verlaengerung zuruecknehmen = Verlaengerung entfaellt
      const extra = x.extra && x.clock.status === 'break' && x.clock.period === x.settings.periods ? null : x.extra;
      return Object.assign({}, x, { extra, clock: Clock.reopen(x.clock) });
    });
    closeSheet(); render(false);
  },
  adjust(el){
    patchMatch(cur().id, x => Object.assign({}, x, { clock: Clock.adjust(x.clock, Date.now(), +el.dataset.ms) }));
    const m = curMatch(); const p = $('clock-prev'); if(p) p.textContent = displayClock(m, Date.now());
    tick(false);
  },
  addLate(el){
    const t = T(), m = curMatch(), side = el.dataset.side;
    openSheet(side === 'own' ? t.addLate : t.addFor(m.oppName), side === 'own' ? t.addLateSub : t.addOppSub,
      '<div class="row2" style="gap:8px"><input class="in nr" id="l-nr" inputmode="numeric" maxlength="2" placeholder="' + esc(t.nrPh) + '" />' +
      '<input class="in" id="l-name" placeholder="' + esc(t.namePh) + '" style="flex:1" /></div>' +
      '<button class="btn" data-act="addLateDo" style="margin-top:8px">' + esc(t.add) + '</button>', { side });
    setTimeout(() => { const i = $('l-name'); if(i) i.focus(); }, 250);
  },
  addLateDo(){
    const name = $('l-name').value.trim(); if(!name) return;
    const n = parseInt($('l-nr').value, 10), side = sheetCtx.side;
    const p = { id: uid(), name: name.slice(0, 40), number: isFinite(n) ? n : null };
    patchMatch(cur().id, x => side === 'own' ? Object.assign({}, x, { ownPlayers: x.ownPlayers.concat([p]) }) : Object.assign({}, x, { oppPlayers: x.oppPlayers.concat([p]) }));
    closeSheet(); render(false); toast(T().playerAdded);
  },
  noteStamp(){
    const m = curMatch(), ta = $('notes'); if(!m || !ta) return;
    const stamp = fmtMinute(Clock.stamp(m.clock, Date.now()), m) + ' ';
    const v = ta.value;
    ta.value = v + (v && !/\n$/.test(v) ? '\n' : '') + stamp;
    m.notes = ta.value.slice(0, 5000); save();
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  },
  notesShare(){ patchMatch(cur().id, x => Object.assign({}, x, { notesShare: !x.notesShare })); render(false); },
  shareReport(){
    const m = curMatch();
    shareText(buildReport(m, Clock.game(m.clock, Date.now())), m.ownName + ' – ' + m.oppName);
  }
};

/* Bearbeiten-Blatt nach einer Aenderung neu zeigen und die Seite dahinter auffrischen */
function refreshEventSheet(id){
  render(false);
  const m = curMatch(), e = m && m.events.find(x => x.id === id);
  if(!e){ closeSheet(); return; }
  openSheet(describe(m, e), fmtMinute(e, m), eventEditor(m, e), { eventId: id });
}

function previewList(){
  const tm = teamById(cur().id);
  const known = new Set(tm.players.map(p => p.name.toLowerCase()));
  const list = parseRoster($('pl-text').value).filter(p => !known.has(p.name.toLowerCase()));
  $('pl-prev').innerHTML = list.length ? '<div class="preview num">' + list.map(p => (p.number != null ? p.number : '–') + '&nbsp;&nbsp;' + esc(p.name) +
    (p.keeper ? ' <span class="twb">TW</span>' : '')).join('<br>') + '</div>' : '';
  const b = $('pl-take');
  b.disabled = !list.length; b.textContent = list.length ? T().takeN(list.length) : T().noneFound;
}

function importSquads(data){
  const t = T();
  const list = teamsFromSquadFile(data);
  if(!list.length){ toast(t.importError); return; }
  list.forEach(k => {
    const { team } = mergeTeam(k.name, k.players, true, k.tb);
    // Haken aus TacticBoard 1:1 uebernehmen, auch bei bekannten Spielern
    k.players.forEach(np => { const p = team.players.find(x => x.name.toLowerCase() === np.name.toLowerCase()); if(p) p.sel = np.sel; });
  });
  save(); render(false); toast(t.importedTeams(list.length));
}

/* Tippen und langes Druecken */
let pressTimer = null, longFired = false;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-long]');
  longFired = false;
  if(!el) return;
  pressTimer = setTimeout(() => { longFired = true; vibrate(20); const f = A[el.dataset.long]; if(f) f(el); }, 550);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(n => document.addEventListener(n, () => clearTimeout(pressTimer)));
document.addEventListener('scroll', () => clearTimeout(pressTimer), true);
document.addEventListener('click', e => {
  if(longFired){ longFired = false; e.preventDefault(); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const f = A[el.dataset.act];
  if(f){ e.preventDefault(); f(el); }
});
document.addEventListener('input', e => {
  const r = cur();
  if(e.target.id === 'opp-name' && r.v === 'new'){
    r.oppName = e.target.value; r.oppId = null;
    // nur Knopf und Hinweis aktualisieren - kein Neuaufbau waehrend des Tippens
    const btn = document.querySelector('[data-act="startMatch"]');
    const team = teamById(r.ownId);
    const starters = team ? team.players.filter(p => role(r, p.id) === 'start').length : 0;
    const ok = r.oppName.trim() && starters > 0 && starters <= r.settings.playersOnField;
    if(btn) btn.disabled = !ok;
    document.querySelectorAll('.chip.opp.on').forEach(c => c.classList.remove('on'));
  }
  if(e.target.id === 'notes' && r.v === 'live'){
    // ohne Neuaufbau speichern, damit der Cursor bleibt
    const m = matchById(r.id); if(m){ m.notes = e.target.value.slice(0, 5000); save(); }
  }
  if(e.target.id === 'team-name' && r.v === 'team'){
    const tm = teamById(r.id); const v = e.target.value.trim();
    if(tm && v){ tm.name = v.slice(0, 50); save(); $('title').textContent = tm.name; }
  }
});
document.addEventListener('change', e => { if(e.target.id === 'opp-name') render(false); });
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(e.target.id === 'p-name'){ e.preventDefault(); A.addPlayer(); }
  if(e.target.id === 'new-team'){ e.preventDefault(); A.createTeam(); }
  if(e.target.id === 'l-name'){ e.preventDefault(); A.addLateDo(); }
});

/* Cordova: Android-Zuruecktaste */
document.addEventListener('deviceready', () => {
  document.addEventListener('backbutton', e => {
    e.preventDefault();
    // Auf der Startseite passiert nichts - die App soll am Spielfeldrand
    // nicht versehentlich zugehen. Beenden geht ueber den App-Wechsler.
    back();
  }, false);
}, false);

/* Web-Fassung: offline nutzbar */
if('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname !== 'localhost'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render(true);
</script>
